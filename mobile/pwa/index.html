<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<title>Offgrid Travel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div>
    <strong>Offgrid Travel</strong>
    <div class="small muted" id="regionName">…</div>
  </div>
  <div class="topright">
    <select id="uiLang" aria-label="Language">
      <option value="en">English</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="zh">中文</option>
    </select>
    <span class="badge" id="net">…</span>
  </div>
</header>

<main>
  <div class="banner small" data-t="banner"></div>

  <section class="packbar">
    <div id="packInfo" class="small"></div>
    <button id="update" class="primary"></button>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabSearch" aria-selected="true" data-t="tabSearch"></button>
    <button role="tab" id="tabSms" aria-selected="false" data-t="tabSms"></button>
  </nav>

  <section id="paneSearch">
    <input id="q" type="search" autocomplete="off">
    <div class="chips" id="cats"></div>
    <div class="toggles">
      <label><input type="checkbox" id="openNow"> <span data-t="openNow"></span></label>
      <label><input type="checkbox" id="cheap"> <span data-t="cheapest"></span></label>
    </div>
    <div class="chips" id="qExamples"></div>
    <div id="count" class="small muted"></div>
    <div id="results"></div>
  </section>

  <section id="paneSms" hidden>
    <p class="small muted" data-t="smsIntro"></p>
    <div class="thread" id="thread"></div>
    <div class="compose">
      <input id="smsText" autocomplete="off">
      <button class="primary" id="smsSend" data-t="send"></button>
    </div>
    <div class="chips" id="smsExamples"></div>
  </section>

  <footer class="small muted">Map data © OpenStreetMap contributors (ODbL).</footer>
</main>
<script src="app.js"></script>
</body>
</html>
